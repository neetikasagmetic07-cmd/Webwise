
name: WordPress Child Theme CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check Theme PHP Files
        run: |
          find wp-content/themes/twentytwentyfour-child \
          -type f -name "*.php" -print0 |
          xargs -0 -r -n1 php -l
